name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Device to build'
        required: true
        type: choice
        options:
          - beyond0lte
          - beyond1lte
          - beyond2lte
          - beyondx
          - d1
          - d1xks
          - d2s
          - d2x
          - d2xks
        default: beyond0lte

  pull_request:

  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0

          while IFS= read -r f; do
            shellcheck \
              -e SC1090,SC1091,SC2001,SC2034,SC2086 \
              -s bash "$f" || CODE=1
          done < <(
            find platform scripts target unica \
              -name "*.sh" \
              -not -name "*ssi.sh" \
              -not -name "config.sh" \
              -not -name "sff.sh"
          )

          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        env:
          SELECTED_TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            matrix=$(jq -cn \
              --arg target "$SELECTED_TARGET" \
              '[$target]')
          else
            matrix="$(
              find target \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%f\n' |
              sort |
              jq -R -s -c \
                'split("\n") | map(select(length > 0))'
            )"
          fi

          echo "Build matrix:"
          echo "$matrix" | jq .

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update

          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr \
            ccache \
            clang \
            ffmpeg \
            libbrotli-dev \
            libbz2-dev \
            libgtest-dev \
            libprotobuf-dev \
            libunwind-dev \
            libpcre2-dev \
            libzstd-dev \
            linux-modules-extra-$(uname -r) \
            lld \
            protobuf-compiler \
            webp \
            curl \
            jq

          sudo modprobe erofs f2fs

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" \
            | base64 --decode > security/unica_platform.pk8

          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" \
            | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}

          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"

          sed \
            -e "/Automatically/d" \
            -e "s/\"//g" \
            "$OUT_DIR/config.sh" >> "$GITHUB_ENV"

          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh

      - name: Upload to GoFile
        if: success()
        run: |
          ZIP_FILE="$(
            find "$OUT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.zip" |
            head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ROM ZIP found!"
            exit 1
          fi

          echo "========================================"
          echo "ROM BUILD COMPLETE"
          echo "========================================"
          echo "Device: ${{ matrix.target }}"
          echo "File: $ZIP_FILE"
          echo "Size:"
          du -h "$ZIP_FILE"

          echo
          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo
          echo "SHA256:"
          sha256sum "$ZIP_FILE"

          echo
          echo "Uploading to GoFile..."

          RESPONSE="$(
            curl -s \
              -F "file=@$ZIP_FILE" \
              -F "token=${{ secrets.GOFILE_TOKEN }}" \
              -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" \
              "https://upload-eu-par.gofile.io/uploadFile"
          )"

          echo
          echo "GoFile response:"
          echo "$RESPONSE" | jq .

          DOWNLOAD_URL="$(
            echo "$RESPONSE" |
            jq -r '.data.downloadPage'
          )"

          if [ "$DOWNLOAD_URL" = "null" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: GoFile upload failed!"
            exit 1
          fi

          echo
          echo "========================================"
          echo "UPLOAD COMPLETE"
          echo "========================================"
          echo "Device: ${{ matrix.target }}"
          echo "Download: $DOWNLOAD_URL"
          echo "========================================"
